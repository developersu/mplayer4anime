steps:
  - name: Build jar
    when:
      event: [tag, push]
    image: maven:3-amazoncorretto-25-debian
    commands:
      - mvn -B -DskipTests clean package -Pwindows
      - mvn test -B
    volumes:
      - /home/docker/woodpecker/files/m2:/root/.m2

  - name: Build Windows installer
    when:
      event: [tag, push, manual]
    image: wheatstalk/makensis:3
    commands:
      - cp "$CI_WORKSPACE/target/mplayer4anime.exe" "$CI_WORKSPACE/misc/windows/NSIS/"
      - $CI_WORKSPACE/misc/windows/create_nsis.sh
      - cd "$CI_WORKSPACE/misc/windows/NSIS"
      - echo Installer-*.exe
      - cp Installer-*.exe "$CI_WORKSPACE/target"
    volumes:
      - /home/docker/woodpecker/files/assembly/openjdk-25.0.1:/assembly/jdk

  - name: Archive artifact
    when:
      event: [tag, push]
    image: alpine:latest
    commands:
      - sha512sum target/mplayer4anime-*jar >> target/sha512.txt
      - sha512sum target/Installer-*exe >> target/sha512.txt
      - export ARTIFACTS_DIR="$(date -d @$CI_PIPELINE_CREATED +'%Y-%m-%d %H:%M %Z')"
      - mkdir -p /builds/$CI_REPO_NAME
      - mv target/Installer-*exe target/mplayer4anime-*jar target/sha512.txt "/builds/$CI_REPO_NAME/$ARTIFACTS_DIR"
    volumes:
      - /home/www/builds:/builds